[workspace]
members = [
    "crates/xshell-adapters",
    "crates/xshell-audit",
    "crates/xshell-cli",
    "crates/xshell-core",
    "crates/xshell-execution",
    "crates/xshell-platform",
    "crates/xshell-pty",
    "crates/xshell-session",
    "crates/xshell-view",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/rdevaul/xshell"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
hex = "0.4"
libc = "0.2"
nix = { version = "0.31", features = ["term"] }
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
sha2 = "0.10"
tokio = { version = "1.47", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1.18", features = ["serde", "v4"] }

[profile.release]
lto = "thin"
strip = true
