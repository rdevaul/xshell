name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / Rust
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-08-05
        with:
          toolchain: 1.98.0
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Probe FutureShell workspace capabilities
        run: ./scripts/futureshell-workspace-probe.sh
      - name: Verify FutureShell FEA fixture
        run: ./fixtures/futureshell/fea/check-fixture.sh
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --workspace --all-targets
      - name: Test home-lab runner lifecycle
        env:
          XSHELL_RUNALL_REAL_BIN_DIR: target/debug
        run: |
          cargo build --locked -p xshell-audit -p xshell-session -p xshell-cli --bins
          python3 -B -m unittest discover -s scripts/tests -v
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  arm64-linux:
    # Native aarch64 Linux runner. Catches libc ABI differences (for
    # example `c_char` is `u8` on aarch64 Linux) that x86_64 cannot, and
    # avoids needing a cross C toolchain for `ring`.
    name: ubuntu-24.04-arm / Rust
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-08-05
        with:
          toolchain: 1.98.0
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Probe FutureShell workspace capabilities
        run: ./scripts/futureshell-workspace-probe.sh
      - name: Run tests
        run: cargo test --workspace --all-targets
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  msrv:
    # Cargo.toml declares rust-version; make sure it is actually true.
    name: msrv / 1.88
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-08-05
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: msrv
      - name: Check with the declared minimum supported Rust version
        run: cargo check --workspace --all-targets

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
