# Copy this file to ~/.config/xshell/config.toml or pass --config PATH.
default_model = "local-qwen"

# Markdown is rendered when stdout is a terminal. Set markdown to "always" for
# forced rendering or "never" for sanitized, otherwise verbatim model output.
# NO_COLOR disables ANSI styling even when color is "always".
[rendering]
markdown = "auto"
color = "auto"
# width = 100

# Auditing is disabled until xshell-auditd has been installed and started.
# Single-user development paths are shown here; both daemons refuse to use a
# directory they do not own or that is group/world writable, so avoid shared
# locations such as /tmp. A tamper-resistant deployment uses a dedicated
# service account and protected paths under /var/db (macOS) or /var/lib (Linux).
[audit]
enabled = false
required = true
# Paths are not tilde-expanded; use absolute paths under your home directory,
# for example /home/USER/.local/state/xshell/audit on Linux or
# /Users/USER/Library/Application Support/xshell/audit on macOS.
socket = "/ABSOLUTE/PATH/TO/xshell-audit/audit.sock"
directory = "/ABSOLUTE/PATH/TO/xshell-audit"
checkpoint_interval = 16

[models.local-qwen]
provider = "ollama"
model = "qwen3:8b"
base_url = "http://127.0.0.1:11434"

[models.openrouter-free]
provider = "openai"
model = "openrouter/free"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"

[models.openai]
provider = "openai"
model = "YOUR_OPENAI_MODEL"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
# The local session service is opt-in while the fabric is under development.
# Start it with: xshelld --config ~/.config/xshell/config.toml
# When socket and state_directory are omitted, xshell uses $XDG_STATE_HOME or
# ~/.local/state/xshell/sessions (Linux) and
# ~/Library/Application Support/xshell/sessions (macOS). Only the owning user
# may connect; the daemon checks the peer UID on every connection.
[session_fabric]
enabled = false
required = true
# socket = "/custom/private/dir/xshelld.sock"
# state_directory = "/custom/private/dir"
default_session = "default"
# Most permissive approval policy this daemon will honour for any client,
# local or remote: "off" (deny agent shell tools), "ask" (prompt), or "auto"
# (run agent shell tools unattended). A client asking for more is clamped to
# this value and told so. Raise to "auto" only on a host where you would run
# `xshell --approval auto` yourself.
max_approval = "ask"
# Read-only agent tools (read_file, list_directory) normally run without a
# prompt. Paths matching these globs are promoted to approval-gated so a model
# cannot silently read credentials. Patterns without "/" match a file name at
# any depth; patterns with "/" are anchored at the session cwd; "**" spans
# directories. Omit to use the built-in defaults (.env, *.pem, *.key, id_*,
# .ssh/**, .aws/**, .git/config, *.tfstate, ...); set to [] to disable.
# sensitive_paths = [".env", ".env.*", "*.pem", "*.key", ".ssh/**", "secrets.*"]
# Prefix for terminal-job commands: d detach, s switch, l last, n/p cycle,
# q terminate, ? help, or repeat the prefix to send it literally.
pty_escape = "ctrl-]"
