# Keeps the SHA-pinned actions in ci.yml current. Dependabot rewrites the
# SHA and the trailing "# vN" comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
