# Copy this file to ~/.config/xshell/config.toml or pass --config PATH.
default_model = "local-qwen"

# Auditing is disabled until xshell-auditd has been installed and started.
# Development paths are shown here. A tamper-resistant deployment uses a
# dedicated service account and protected paths under /var/db (macOS) or
# /var/lib (Linux).
[audit]
enabled = false
required = true
socket = "/tmp/xshell-audit.sock"
directory = "/tmp/xshell-audit"
checkpoint_interval = 16

[models.local-qwen]
provider = "ollama"
model = "qwen3:8b"
base_url = "http://127.0.0.1:11434"

[models.openrouter-free]
provider = "openai"
model = "openrouter/free"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"

[models.openai]
provider = "openai"
model = "YOUR_OPENAI_MODEL"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
# The local session service is opt-in while the fabric is under development.
# Start it with: xshelld --config ~/.config/xshell/config.toml
[session_fabric]
enabled = false
required = true
socket = "/tmp/xshell-session-state/xshelld.sock"
state_directory = "/tmp/xshell-session-state"
default_session = "default"
