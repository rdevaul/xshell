# Copy this file to ~/.config/xshell/config.toml or pass --config PATH.
default_model = "local-qwen"

# Markdown is rendered when stdout is a terminal. Set markdown to "always" for
# forced rendering or "never" for sanitized, otherwise verbatim model output.
# NO_COLOR disables ANSI styling even when color is "always".
[rendering]
markdown = "auto"
color = "auto"
# width = 100

# `//view` pages long rendered text on the controlling terminal. The pager is
# an argv vector and is launched directly, never through a shell. "auto" pages
# only when the rendered output is taller than the terminal; "always" and
# "never" may be overridden per invocation with --paginate/--no-paginate.
[view]
pagination = "auto"
pager = ["less", "-R", "-X"]

# Policy may be specialized by presentation class and then by canonical viewer
# ID. Viewer policy has precedence over class policy; command flags win over both.
# Future viewers can add typed options for classes such as image, video, and
# model-3d without changing the acquisition/presentation boundary.
# [view.classes.text]
# pagination = "auto"
# [view.viewers.markdown]
# pagination = "always"

# Auditing is disabled until xshell-auditd has been installed and started.
# Single-user development paths are shown here; both daemons refuse to use a
# directory they do not own or that is group/world writable, so avoid shared
# locations such as /tmp. A tamper-resistant deployment uses a dedicated
# service account and protected paths under /var/db (macOS) or /var/lib (Linux).
[audit]
enabled = false
required = true
# Paths are not tilde-expanded; use absolute paths under your home directory,
# for example /home/USER/.local/state/xshell/audit on Linux or
# /Users/USER/Library/Application Support/xshell/audit on macOS.
socket = "/ABSOLUTE/PATH/TO/xshell-audit/audit.sock"
directory = "/ABSOLUTE/PATH/TO/xshell-audit"
checkpoint_interval = 16
# Interactive processes ($ commands running in a PTY) always have their start
# and exit audited. Set true to also record the byte-for-byte stream (operator
# input and program output). Off by default: the trail is for agent accountability.
terminal_stream = false
# Per-job cap on captured stream bytes; 0 = unbounded.
terminal_stream_max_bytes = 16777216
# How long xshelld waits for the audit service to acknowledge one record (or to
# open or close an audit session) before failing it. With required = true the
# audited action is refused; one stalled exchange delays only its own session.
ack_timeout_ms = 5000

# Remote bootstrap stays disabled unless a signed release source is configured.
# The public key is an Ed25519 verifying key encoded as 64 lowercase hex
# characters. It is a trust anchor, not a secret. `{version}` resolves to the
# exact version of the controlling xshell binary; manifests and artifacts must
# use HTTPS and must also match the controller's session protocol.
# [remote_bootstrap]
# manifest_url = "https://github.com/rdevaul/xshell/releases/download/v{version}/xshell-release.json"
# public_key = "RELEASE_ED25519_PUBLIC_KEY_HEX"

# Turn limits. Every agent turn, with the subagents it starts, draws from one
# budget. Two profiles are built in:
#   default: 128 provider requests, 256 tool calls (64 per response), 1h wall
#            time, 60s shell timeout, 2 automatic continuations, 8 MiB of
#            tool output (tool_output_bytes)
#   relaxed: 2000 provider requests, 5000 tool calls (128 per response), 8h
#            wall time, 30m shell timeout, 50 automatic continuations,
#            128 MiB of tool output
# Choose one with --limits NAME, //limits NAME, `limits = "NAME"` on a model
# profile, or `limits` below (checked in that order). A table named after a
# built-in profile overrides only the fields it sets; any other name defines a
# new profile that starts from `default`. Durations take s, m, h, or d.
# [agent]
# limits = "default"
#
# [agent.limit_profiles.relaxed]
# wall_time = "12h"
#
# [agent.limit_profiles.cad-render]
# shell_timeout = "45m"
# tool_calls = 1000

[models.local-qwen]
provider = "ollama"
model = "qwen3:8b"
base_url = "http://127.0.0.1:11434"
# Limit profile for turns with this model, unless --limits or //limits chose one.
# limits = "relaxed"
# Per-model history budget (bytes of content + tool arguments). Size to the
# model's context window; a small local model needs a much tighter budget than
# a 200K-context cloud model. Overrides session_fabric.compaction. 0 = never
# compact for this model.
max_history_bytes = 32768
# The model's context window in tokens. When set, the enforced budget is
# additionally capped by what this window can actually hold, so a
# max_history_bytes that is too large for the model cannot overflow it. Set
# this to match the server (llama.cpp: -c / --ctx-size; vLLM: --max-model-len;
# Ollama: num_ctx).
# context_tokens = 32768
# Tokens held back for the model's own reply when context_tokens is set.
# Default 1024.
# reserve_output_tokens = 1024
# Whether the model takes images (a vision model such as qwen2.5vl or
# gemma3). Without it, images in the conversation are sent as short text
# placeholders naming them.
# vision = true

[models.openrouter-free]
provider = "openai"
model = "openrouter/free"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"

[models.openai]
provider = "openai"
model = "YOUR_OPENAI_MODEL"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
# The local session service is opt-in while the fabric is under development.
# Start it with: xshelld --config ~/.config/xshell/config.toml
# When socket and state_directory are omitted, xshell uses $XDG_STATE_HOME or
# ~/.local/state/xshell/sessions (Linux) and
# ~/Library/Application Support/xshell/sessions (macOS). Only the owning user
# may connect; the daemon checks the peer UID on every connection.
[session_fabric]
enabled = false
required = true
# socket = "/custom/private/dir/xshelld.sock"
# state_directory = "/custom/private/dir"
default_session = "default"
# Most permissive approval policy this daemon will honour for any client,
# local or remote: "off" (deny agent shell tools), "ask" (prompt), or "auto"
# (run agent shell tools unattended). A client asking for more is clamped to
# this value and told so. Raise to "auto" only on a host where you would run
# `xshell --approval auto` yourself.
max_approval = "ask"
# Daemon-wide budgets: turns running at once across all sessions, and sessions
# kept at once. Beyond either, new turns or sessions are refused (xshell run
# exits 6) until one finishes or is closed.
# max_concurrent_turns = 8
# max_sessions = 256
# Read-only agent tools (read_file, list_directory) normally run without a
# prompt. Paths matching these globs are promoted to approval-gated so a model
# cannot silently read credentials. Patterns are matched against the canonical
# absolute path of the file or directory being read, so the result does not
# depend on the session cwd. Patterns without "/" match a file name; patterns
# with "/" match at any depth (".git/config" also covers nested repositories);
# a leading "/" anchors a pattern to the filesystem root; "**" spans
# directories. Omit to use the built-in defaults (.env, *.pem, *.key, id_*,
# .ssh/**, .aws/**, .git/config, *.tfstate, ...); set to [] to disable.
# sensitive_paths = [".env", ".env.*", "*.pem", "*.key", ".ssh/**", "secrets.*"]
# Session-wide default conversation-history budget. Every model request
# carries the whole history; once its content plus tool-call arguments exceed
# this many bytes, the oldest whole turns are dropped before each provider
# request and after the turn completes (the system prompt and the most recent
# turn are always kept, and oversized tool results in the current turn are
# elided when no whole turn can be dropped). A model profile's own
# max_history_bytes overrides this, since the right depth depends on that
# model's context window. Omit to fall back to the model's declared
# context_tokens; set to 0 to keep full history. Compaction is reported in the
# transcript and recorded in the audit log.
#
# max_history_bytes is BYTES, not tokens. Roughly 3 bytes per token for code
# and JSON; do not size it to the window itself - leave room for the reply and
# for tool definitions. For a 262144-token model, 200000 is a safe default.
# (the [session_fabric.compaction] table is at the end of this section)
# Prefix for interactive-process commands: d detach, s switch, l last, n/p cycle,
# q terminate, ? help, or repeat the prefix to send it literally.
#
# Accepts a single ASCII key or ctrl-KEY. The prefix is consumed before the line
# editor and before any attached full-screen program, so a prefix that shares a
# byte with a terminal function takes that function over everywhere in xshell:
#
#   ctrl-c  Ctrl-C (interrupt)      ctrl-i  Tab (completion)
#   ctrl-d  Ctrl-D (end of input)   ctrl-m  Enter (submit)
#   ctrl-h  Backspace               ctrl-[  Esc
#
# These stay configurable — an editing environment that does not privilege those
# keys is a legitimate setup — but xshell warns at startup when you pick one.
# Pressing the prefix twice always sends the literal byte through.
pty_escape = "ctrl-]"

# Sub-tables of [session_fabric] go after its plain keys.
# [session_fabric.compaction]
# max_history_bytes = 200000

# The most generous turn limits this daemon applies, whatever a client asks for.
# Unset fields take the built-in relaxed profile's values, so clients can use
# `relaxed` unless you lower them here. A client asking for more is clamped
# field by field and told so.
# [session_fabric.max_limits]
# wall_time = "4h"
# tool_calls = 2000

# The approval policy every agent tool call on this daemon is decided by,
# combined with the approval mode (see docs/session-fabric.md#approval-policy).
# Entries name a tool, `run_shell: PATTERN` (matched against the parsed
# command), or `read_file: PATH` / `list_directory: PATH`. A client's own policy
# (xshell --approval-policy FILE) can only restrict this one.
# [session_fabric.approval_policy]
# always_allowed = ["run_shell: git status"]
# allowed = ["run_shell: yapcad *", "run_shell: make *"]
# denied = ["run_shell: rm *", "run_shell: git push *"]

# Sensitivity classes: "prompt" paths need approval for agent reads (as
# sensitive_paths); "block" paths can never be read by agent read tools.
# [[session_fabric.sensitivity]]
# action = "block"
# patterns = ["*.pem", "*.key", "*.p12", "id_rsa", "id_ed25519"]
